title: "Caysen's Digital Portfolio"
description: "Caysen Mayo's Computer Engineering portfolio: embedded systems, electrical hardware, Linux, and scientific data analysis."
url: ""
baseurl: ""
markdown: kramdown
permalink: pretty

# Projects collection
collections:
  projects:
    output: true
    permalink: /projects/:name/

# Build with the project's Jekyll stack; GitHub Actions publishes the output.
plugins:
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - .ruby-version
  - README.md
  - MACOS_PANTHER_HANDOFF.md
  - os_x_jaguar_trafficlights_by_p0t4t0x_d8gk9zc.psd
  - scripts
  - resume.tex
