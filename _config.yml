title: "Caysen's Digital Portfolio"
description: "A Mac OS X Panther inspired portfolio on GitHub Pages"
url: ""
baseurl: ""
markdown: kramdown
permalink: pretty

# Projects collection
collections:
  projects:
    output: true
    permalink: /projects/:name/

# Use the default build settings for GitHub Pages
plugins:
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - MACOS_PANTHER_HANDOFF.md
  - os_x_jaguar_trafficlights_by_p0t4t0x_d8gk9zc.psd
  - scripts
