name: Build site and capture viewport screenshot

on:
  push:
    branches: [ master ]

jobs:
  screenshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.1'

    - name: Install Bundler
      run: gem install bundler

    - name: Install dependencies
      run: bundle install

    - name: Build Jekyll site
      env:
        JEKYLL_ENV: screenshot
      run: bundle exec jekyll build -d _site

    - name: Start simple HTTP server (background)
      run: |
        cd _site
        python3 -m http.server 4000 &
        sleep 10

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Playwright
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install playwright
        python3 -m playwright install --with-deps chromium

    - name: Run screenshot script
      env:
        SCREENSHOT_URL: http://localhost:4000
        SCREENSHOT_OUTPUT: screenshot.png
        SCREENSHOT_WIDTH: 1280
        SCREENSHOT_HEIGHT: 600
      run: python3 scripts/screenshot.py

    - name: Publish screenshot to screenshot-placeholder
      run: |
        cp screenshot.png /tmp/screenshot.png
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git fetch origin screenshot-placeholder || true
        if git show-ref --quiet refs/remotes/origin/screenshot-placeholder; then
          git checkout -B screenshot-placeholder origin/screenshot-placeholder
        else
          git checkout --orphan screenshot-placeholder
        fi
        mkdir -p screenshots
        cp /tmp/screenshot.png screenshots/latest.png
        git add screenshots/latest.png
        if git diff --cached --quiet; then
          echo "No screenshot changes to publish."
        else
          git commit -m "Update screenshot"
          git push origin screenshot-placeholder
        fi

    - name: Upload screenshot artifact
      uses: actions/upload-artifact@v4
      with:
        name: site-screenshot
        path: screenshot.png
