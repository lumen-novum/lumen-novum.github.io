<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ site.description }}" />
    <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}" />
    {% seo %}
  </head>
  <body>
    <main class="window{% if page.centered %} centered{% endif %}">
      <div class="window-titlebar">
        <div class="window-title">{{ page.title }}</div>
        <div class="window-controls" aria-hidden="true">
          <span class="control control-close">
            <img src="{{ "/assets/imgs/jaguar-trafficlights/close.png" | relative_url }}" alt="" width="32" height="32" draggable="false" />
          </span>
          <span class="control control-minimize">
            <img src="{{ "/assets/imgs/jaguar-trafficlights/minimize.png" | relative_url }}" alt="" width="32" height="32" draggable="false" />
          </span>
          <span class="control control-zoom">
            <img src="{{ "/assets/imgs/jaguar-trafficlights/maximize.png" | relative_url }}" alt="" width="32" height="32" draggable="false" />
          </span>
        </div>
      </div>
      <div class="window-content">
        {{ content }}
      </div>
    </main>
  </body>
</html>
