---
layout: default
---

<section class="project-detail">
  <h1>{{ page.title }}</h1>
  {% if page.description %}
  <p class="project-detail__lead">{{ page.description }}</p>
  {% endif %}
  <div class="project-detail__meta">
    {% if page.stack %}<span>Stack: {{ page.stack }}</span>{% endif %}
    {% if page.year %}<span>Year: {{ page.year }}</span>{% endif %}
    {% if page.link %}<a href="{{ page.link }}">Live Link</a>{% endif %}
  </div>
  <div class="project-detail__content">
    {{ content }}
  </div>
</section>
